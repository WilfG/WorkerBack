services:
  worker-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: worker-api:latest
    container_name: worker-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8002:80"
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: https://worker.wiltek-software.online
      APP_KEY: ${APP_KEY}
      LOG_CHANNEL: stderr
      DB_CONNECTION: mysql
      DB_HOST: host.docker.internal
      DB_PORT: 3306
      DB_DATABASE: worker_db
      DB_USERNAME: worker_db
      DB_PASSWORD: ${DB_PASSWORD}
      CACHE_DRIVER: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
    volumes:
      - ./storage:/var/www/html/storage
    extra_hosts:
      - "host.docker.internal:host-gateway"
    mem_limit: 512m
    cpus: 1.0